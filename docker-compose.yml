# 本地开发用 PostgreSQL 16
# 启动：docker compose up -d
# 停止：docker compose down
# 清空数据：docker compose down -v
#
# 注：生产用 pgvector/pgvector:pg16（含 pgvector 扩展，expert_source.embedding_ref 用 vector(1536)）
# 本地开发 embedding_ref 暂用 text 类型（🔵 预留字段，MVP 不写入）
services:
  postgres:
    image: postgres:16-alpine
    container_name: drruby-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drruby
      POSTGRES_PASSWORD: drruby
      POSTGRES_DB: drruby
      # shadow database（prisma migrate dev 需要）
      POSTGRES_MULTIPLE_DATABASES: drruby_shadow
    ports:
      - "5433:5432"
    volumes:
      - drruby-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drruby -d drruby"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  drruby-postgres-data:
